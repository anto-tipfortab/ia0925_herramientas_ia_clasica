<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FunStay Concierge — Demo de voz</title>
<style>
  :root{
    --navy:#1F3A93; --teal:#138D90; --amber:#E08E0B; --bg:#0e1726; --card:#16223a;
    --user:#24406b; --agent:#0f3d3e; --muted:#8aa0c0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:linear-gradient(160deg,#0e1726,#13203a);color:#eaf0f6;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;text-align:center;padding:26px 16px 10px}
  h1{margin:0;font-size:26px;letter-spacing:.3px}
  h1 .sun{color:var(--amber)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .chat{width:min(720px,92vw);flex:1;margin:14px 0;padding:8px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:54vh}
  .bubble{padding:11px 14px;border-radius:14px;max-width:78%;line-height:1.4;font-size:15px;white-space:pre-wrap;animation:pop .18s ease}
  .me{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--agent);border-bottom-left-radius:4px}
  .meta{font-size:11px;color:var(--muted);margin:2px 6px}
  .me+.meta{text-align:right}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .controls{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 30px}
  #mic{width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;font-size:38px;color:#fff;
       background:radial-gradient(circle at 30% 30%,#2a5298,var(--navy));box-shadow:0 8px 30px rgba(31,58,147,.5);transition:transform .12s, box-shadow .2s}
  #mic:hover{transform:translateY(-2px)}
  #mic.rec{background:radial-gradient(circle at 30% 30%,#ff6b6b,#c0392b);box-shadow:0 0 0 0 rgba(192,57,43,.6);animation:pulse 1.2s infinite}
  #mic:disabled{opacity:.5;cursor:default;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}70%{box-shadow:0 0 0 22px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
  .status{color:var(--muted);font-size:14px;min-height:20px}
  .hint{color:var(--muted);font-size:12px;max-width:520px;text-align:center;line-height:1.5}
  .lang{display:inline-block;font-size:10px;background:var(--teal);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .empty{color:var(--muted);text-align:center;margin-top:30px;font-size:14px}
</style>
</head>
<body>
  <header>
    <h1>Fun<span class="sun">Stay</span> Concierge</h1>
    <div class="sub">Asistente de voz · Español / English · Whisper → Dialogflow → Polly</div>
  </header>

  <div class="chat" id="chat">
    <div class="empty" id="empty">Pulsa el micrófono y di <b>“Hola”</b> para empezar.</div>
  </div>

  <div class="controls">
    <button id="mic" title="Pulsa para hablar">🎙️</button>
    <div class="status" id="status">Listo</div>
    <div class="hint">Pulsa para grabar, pulsa otra vez para enviar. Empieza con <b>“Hola”</b>, luego di tu código:
      <b>“Mi código de reserva es FS uno dos tres cuatro cinco seis”</b>.</div>
  </div>

<script>
const chat = document.getElementById('chat');
const micBtn = document.getElementById('mic');
const statusEl = document.getElementById('status');
const empty = document.getElementById('empty');
const SESSION = 'web-' + Math.random().toString(36).slice(2, 10);

let mediaRecorder = null, chunks = [], recording = false, stream = null;

function addBubble(text, who, meta){
  if(empty) empty.remove();
  const b = document.createElement('div');
  b.className = 'bubble ' + (who === 'me' ? 'me' : 'bot');
  b.textContent = text;
  chat.appendChild(b);
  if(meta){
    const m = document.createElement('div');
    m.className = 'meta';
    m.innerHTML = meta;
    chat.appendChild(m);
  }
  chat.scrollTop = chat.scrollHeight;
}

async function ensureStream(){
  if(!stream){
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }
  return stream;
}

async function startRec(){
  await ensureStream();
  chunks = [];
  mediaRecorder = new MediaRecorder(stream, {mimeType: pickMime()});
  mediaRecorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = sendAudio;
  mediaRecorder.start();
  recording = true;
  micBtn.classList.add('rec');
  micBtn.textContent = '⏹️';
  statusEl.textContent = 'Escuchando… (pulsa para enviar)';
}

function pickMime(){
  const c = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  for(const t of c){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}

function stopRec(){
  if(mediaRecorder && recording){
    recording = false;
    micBtn.classList.remove('rec');
    micBtn.textContent = '🎙️';
    statusEl.textContent = 'Procesando…';
    micBtn.disabled = true;
    mediaRecorder.stop();
  }
}

async function sendAudio(){
  const blob = new Blob(chunks, {type: chunks[0]?.type || 'audio/webm'});
  const ext = (blob.type.includes('mp4')) ? '.mp4' : (blob.type.includes('ogg') ? '.ogg' : '.webm');
  const fd = new FormData();
  fd.append('audio', blob, 'turn' + ext);
  fd.append('session_id', SESSION);
  try{
    const res = await fetch('/voice', {method:'POST', body: fd});
    if(!res.ok){ throw new Error('HTTP ' + res.status); }
    const data = await res.json();
    if(data.user_text) addBubble(data.user_text, 'me', '🗣️ tú <span class="lang">'+ (data.language||'') +'</span>');
    addBubble(data.reply_text, 'bot', '🤖 concierge' + (data.intent ? ' · <i>'+data.intent+'</i>' : ''));
    statusEl.textContent = 'Hablando…';
    if(data.audio_b64){
      const audio = new Audio('data:audio/mp3;base64,' + data.audio_b64);
      audio.onended = () => statusEl.textContent = 'Listo';
      audio.play().catch(()=> statusEl.textContent = 'Listo');
    } else { statusEl.textContent = 'Listo'; }
  }catch(err){
    addBubble('⚠️ Error: ' + err.message, 'bot');
    statusEl.textContent = 'Error — reintenta';
  }finally{
    micBtn.disabled = false;
  }
}

micBtn.addEventListener('click', () => {
  if(recording) stopRec(); else startRec().catch(e=>{
    statusEl.textContent = 'No hay acceso al micrófono';
    addBubble('⚠️ ' + e.message, 'bot');
  });
});
</script>
</body>
</html>
